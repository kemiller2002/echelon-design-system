name: Complete Forma physics site examples work

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/complete-forma-physics-site-examples-work.yml"

permissions:
  contents: write

jobs:
  complete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install and verify
        run: |
          npm install --ignore-scripts=false
          dotnet restore tools/TokenCompiler/TokenCompiler.fsproj
          npx playwright install --with-deps chromium
          npm run site:check

      - name: Complete GH-33 and validate
        shell: bash
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          ./ros work complete \
            --id "GH-33" \
            --occurred-at "$NOW" \
            --evidence implementation=tools/build-site.mjs \
            --evidence tests=tests/site-build.test.mjs \
            --evidence requirements=requirements/COMPONENT-CATALOG.md \
            --evidence decision=docs/decisions/ADR-0002-zero-runtime-html-css-components.md
          ./ros registry build
          ./ros validate
          ./ros status

      - name: Commit completed work state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ros/context .ros/events .ros/work registries || true
          if [ -d .ros/telemetry ]; then git add -f .ros/telemetry; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Complete GH-33 Forma site examples work"
          git pull --rebase origin main
          git push
