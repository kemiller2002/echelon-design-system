name: Refresh pilot ROS registries

on:
  push:
    branches:
      - pilot/tokens-switch-slider

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: pilot/tokens-switch-slider
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Rebuild registries
        run: ./ros registry build
      - name: Commit generated registries
        shell: bash
        run: |
          git config user.name "Echelon Upgrade Bot"
          git config user.email "actions@users.noreply.github.com"
          git add registries
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: rebuild ROS research registries"
          git push
