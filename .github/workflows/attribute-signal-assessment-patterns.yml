name: Attribute Signal assessment patterns

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  attribute:
    if: github.head_ref == 'feature/signal-assessment-patterns' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Record Signal assessment pattern work
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          TS="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          ./ros work capture --title "Signal assessment and Ordo design-system patterns" --id WI-0004 --priority high --occurred-at "$TS" --actor "ChatGPT"
          ./ros work backlog-transition --id WI-0004 --action ready --occurred-at "$TS"
          ./ros work start --id WI-0004 --occurred-at "$TS" --type implementation --actor "ChatGPT"
          ROS_BASE_REF="$BASE_SHA" ./ros work complete --id WI-0004 --occurred-at "$TS" --actor "ChatGPT"             --evidence requirements=requirements/SIGNAL-COMPONENT-MAP.md             --evidence implementation=patterns/ordinal-scale.html             --evidence tests=tests/browser/assessment.spec.mjs             --conclusion "Signal requirements mapped to reusable zero-runtime assessment patterns"
          ROS_BASE_REF="$BASE_SHA" ./ros validate

      - name: Commit ROS records
        shell: bash
        run: |
          git config user.name "Echelon Upgrade Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git reset -- .github/workflows
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: record Signal assessment patterns in ROS"
          git push
