name: Attribute zero-runtime design-system pilot

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  attribute:
    if: github.head_ref == 'pilot/tokens-switch-slider' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build research registries
        run: ./ros registry build

      - name: Record zero-runtime pilot work
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          TS="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          ./ros work capture --title "Zero-runtime HTML CSS design system pilot" --id WI-0003 --priority high --occurred-at "$TS" --actor "ChatGPT"
          ./ros work backlog-transition --id WI-0003 --action ready --occurred-at "$TS"
          ./ros work start --id WI-0003 --occurred-at "$TS" --type implementation --actor "ChatGPT"
          ROS_BASE_REF="$BASE_SHA" ./ros work complete --id WI-0003 --occurred-at "$TS" --actor "ChatGPT"             --evidence implementation=docs/decisions/ADR-0002-zero-runtime-html-css-components.md             --evidence tests=tests/zero-runtime.test.mjs             --conclusion "zero-runtime pilot architecture implemented"
          ROS_BASE_REF="$BASE_SHA" ./ros validate

      - name: Commit ROS records and generated registries
        shell: bash
        run: |
          git config user.name "Echelon Upgrade Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git reset -- .github/workflows
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: record zero-runtime pilot in ROS"
          git push
