name: Complete Forma site tracked work

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/forma-site-work.yml"

permissions:
  contents: write

jobs:
  complete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install and build
        run: |
          npm install --ignore-scripts=false
          dotnet restore tools/TokenCompiler/TokenCompiler.fsproj
          npm run site:check

      - name: Complete GH-9 and validate
        shell: bash
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          ./ros work complete             --id "GH-9"             --occurred-at "$NOW"             --evidence implementation=tools/build-site.mjs             --evidence tests=tests/site-build.test.mjs
          ./ros registry build
          ./ros validate
          ./ros status

      - name: Commit completed work state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ros/context .ros/events .ros/work registries || true
          if [ -d .ros/telemetry ]; then git add -f .ros/telemetry; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Complete GH-9 Forma documentation site"
          git pull --rebase origin main
          git push
