name: Forma site tracked work

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/forma-site-work.yml"

permissions:
  contents: write

jobs:
  begin:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Begin GH-9
        shell: bash
        run: |
          set -euo pipefail
          WORK_ID="GH-9"
          ./ros add "Build Forma component documentation site"             --id "$WORK_ID"             --tag forma,documentation,github-pages             --priority high             --source github-issue             --source-reference "https://github.com/kemiller2002/echelon-design-system/issues/9"             --actor "agent:chatgpt"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          ./ros work backlog-transition --action ready --id "$WORK_ID" --occurred-at "$NOW"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          ./ros work start --id "$WORK_ID" --occurred-at "$NOW" --type feature
          ./ros work context "$WORK_ID"

      - name: Commit active work state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ros/context .ros/events .ros/work || true
          if [ -d .ros/telemetry ]; then git add -f .ros/telemetry; fi
          git commit -m "Begin GH-9 Forma documentation site"
          git pull --rebase origin main
          git push
