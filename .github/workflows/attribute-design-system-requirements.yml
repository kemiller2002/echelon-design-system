name: Attribute design system requirements

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  attribute:
    if: github.head_ref == 'requirements/deep-design-system' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout requirements branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build research registries
        run: ./ros registry build

      - name: Record requirements research work
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          TS="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          ./ros work capture --title "Deep design system requirements" --id WI-0002 --priority high --occurred-at "$TS" --actor "ChatGPT"
          ./ros work backlog-transition --id WI-0002 --action ready --occurred-at "$TS"
          ./ros work start --id WI-0002 --occurred-at "$TS" --type research --actor "ChatGPT"
          ROS_BASE_REF="$BASE_SHA" ./ros work complete --id WI-0002 --occurred-at "$TS" --actor "ChatGPT" --evidence research-record=research/packages/RP-DESIGN-2026-0001--design-system-requirements.md --conclusion "requirements baseline established"
          ROS_BASE_REF="$BASE_SHA" ./ros validate

      - name: Commit ROS attribution and generated registries
        shell: bash
        run: |
          git config user.name "Echelon Upgrade Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git reset -- .github/workflows
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: record design system requirements research in ROS"
          git push
