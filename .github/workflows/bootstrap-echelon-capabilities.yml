name: Bootstrap Echelon capabilities

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install ROS
        run: npx --yes --package=@echelon-foundry/repository-operating-system@3.1.4 ros init

      - name: Install SDE / Ordo
        run: npx --yes @echelon-foundry/sde@1.3.0 init

      - name: Install Visual Engineering
        run: npx --yes @echelon-foundry/visual-engineering@1.0.0 init

      - name: Install Communication Engineering
        run: npm exec --yes --package=github:kemiller2002/communication-engineering#4590d2fe6f7e80b339117d3fbee5803f2dd39122 communication-engineering -- init

      - name: Verify SDE / Ordo
        run: npx --yes @echelon-foundry/sde@1.3.0 verify --strict

      - name: Verify ROS
        run: npx --yes --package=@echelon-foundry/repository-operating-system@3.1.4 ros verify --strict

      - name: Verify Visual Engineering
        run: npx --yes @echelon-foundry/visual-engineering@1.0.0 verify --strict

      - name: Verify Communication Engineering
        run: npm exec --yes --package=github:kemiller2002/communication-engineering#4590d2fe6f7e80b339117d3fbee5803f2dd39122 communication-engineering -- verify --strict

      - name: Commit installed capability state
        shell: bash
        run: |
          rm -f .github/workflows/bootstrap-echelon-capabilities.yml
          rm -f .echelon-bootstrap-trigger
          git config user.name "Echelon Upgrade Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: install current Echelon engineering capabilities"
          git push
