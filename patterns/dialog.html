<button type="button" commandfor="example-dialog" command="show-modal">Open dialog</button>
<dialog class="ef-dialog" id="example-dialog">
  <div class="ef-dialog__body">
    <h2>Confirm action</h2>
    <p>The browser owns modal focus, inertness, and Escape behavior.</p>
  </div>
  <div class="ef-dialog__actions">
    <button type="button" commandfor="example-dialog" command="close">Cancel</button>
  </div>
</dialog>
