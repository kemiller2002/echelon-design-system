<button type="button" commandfor="context-drawer" command="show-modal">Open details</button>
<dialog class="ef-drawer" id="context-drawer" aria-labelledby="context-drawer-title" data-side="end" data-ef-motion-weight="heavy">
  <header class="ef-drawer__header">
    <h2 id="context-drawer-title">Record details</h2>
    <button type="button" commandfor="context-drawer" command="close">Close</button>
  </header>
  <div class="ef-drawer__body">
    <p>Contextual detail remains adjacent to the work without replacing the underlying application state.</p>
  </div>
  <footer class="ef-drawer__actions">
    <button type="button" commandfor="context-drawer" command="close">Done</button>
  </footer>
</dialog>
